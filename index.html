<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Film & Photography Lead</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: #a0a0a0;
      margin-bottom: 40px;
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 30px;
      border: 1px solid #333;
    }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .skills-list {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      list-style: none;
      padding: 0;
    }
    .skill-tag {
      background: #2b2b2b;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      border: 1px solid #444;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Graphic Design Portfolio</h1>
    <p class="subtitle">Application for Film & Photography Club Lead</p>

    <div class="card">
      <h2>Featured 3D Render</h2>
      <img src="render.png" alt="3D Orthographic Graphic Design Render">
      <p style="margin-top: 15px; color: #ccc;">
        Created in Blender using orthographic projection, custom shading, and vector-style line art overlays.
      </p>
    </div>

    <div class="card">
      <h2>Technical Skills</h2>
      <ul class="skills-list">
        <li class="skill-tag">Blender 3D</li>
        <li class="skill-tag">Orthographic Modeling</li>
        <li class="skill-tag">Photo Masking</li>
        <li class="skill-tag">Layout Design</li>
      </ul>
    </div>
  </div>
</body>
</html>
