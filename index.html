<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Film & Photography Lead</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('Knight Render BG.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #ffffff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }
    header {
      padding: 24px 20px;
      background: rgba(10, 10, 10, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
    }
    h1 {
      font-size: 1.6rem;
      letter-spacing: 0.5px;
    }
    p.sub {
      color: #aaaaaa;
      font-size: 0.85rem;
      margin-top: 4px;
    }

    /* 4-Column Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    @media (max-width: 900px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .thumb {
      position: relative;
      width: 100%;
      padding-top: 100%;
      overflow: hidden;
      background: rgba(15, 15, 15, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
    }
    .thumb img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Graphic Design Portfolio</h1>
    <p class="sub">Film & Photography Club Lead Application</p>
  </header>

  <div class="gallery-grid">
    <!-- Item 1 -->
    <div class="thumb">
      <img src="VANITY LICNESE PLATE.png" alt="Vanity License Plate">
    </div>

    <!-- Item 2 -->
    <div class="thumb">
      <img src="Template 1.png" alt="Template Graphic">
    </div>

    <!-- Item 3 -->
    <div class="thumb">
      <img src="Background EX 1.png" alt="Background Graphic">
    </div>
  </div>

</body>
</html>
