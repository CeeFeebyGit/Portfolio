<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Film & Photography Lead</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('Knight Render BG.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #ffffff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      padding-bottom: 60px;
    }
    header {
      padding: 24px 20px;
      background: rgba(10, 10, 10, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
    }
    h1 {
      font-size: 1.6rem;
      letter-spacing: 0.5px;
    }
    p.sub {
      color: #aaaaaa;
      font-size: 0.85rem;
      margin-top: 4px;
    }

    /* Italicized Section Subheading */
    .section-title {
      max-width: 1400px;
      margin: 30px auto 10px auto;
      padding: 0 20px;
      font-size: 1.2rem;
      font-style: italic;
      color: #dddddd;
      letter-spacing: 1px;
    }

    /* 4-Column Grid Layout */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 0 20px 20px 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    @media (max-width: 900px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .thumb {
      position: relative;
      width: 100%;
      padding-top: 100%;
      overflow: hidden;
      background: rgba(15, 15, 15, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
    }
    .thumb img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 8px;
    }

    /* Sticky Bottom Black Bar */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40px;
      background: #000000;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    footer p {
      color: #666666;
      font-size: 0.75rem;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Graphic Design Portfolio</h1>
    <p class="sub">Film & Photography Club Lead Application</p>
  </header>

  <!-- Main 4 Entries -->
  <div class="gallery-grid" style="margin-top: 20px;">
    <div class="thumb">
      <img src="VANITY LICNESE PLATE.png" alt="Vanity License Plate">
    </div>
    <div class="thumb">
      <img src="Template 1.png" alt="Template Graphic">
    </div>
    <div class="thumb">
      <img src="Background EX 1.png" alt="Background Graphic">
    </div>
    <div class="thumb">
      <img src="Knight Render BG.png" alt="Knight Render">
    </div>
  </div>

  <!-- Application Section Header -->
  <h2 class="section-title">APPLICATION</h2>

  <!-- Screenshots Grid -->
  <div class="gallery-grid">
    <div class="thumb">
      <img src="Screenshot 2026-10-04 223558.png" alt="Screenshot 1">
    </div>
    <div class="thumb">
      <img src="Screenshot 2026-10-04 223638.png" alt="Screenshot 2">
    </div>
    <div class="thumb">
      <img src="Screenshot 2026-10-04 233318.png" alt="Screenshot 3">
    </div>
    <div class="thumb">
      <img src="Screenshot 2026-10-04 233329.png" alt="Screenshot 4">
    </div>
    <div class="thumb">
      <img src="Screenshot 2026-10-04 233348.png" alt="Screenshot 5">
    </div>
  </div>

  <!-- Bottom Black Bar -->
  <footer>
    <p>© FILM & PHOTOGRAPHY CLUB LEAD PORTFOLIO</p>
  </footer>

</body>
</html>
